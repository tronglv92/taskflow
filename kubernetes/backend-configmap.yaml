# TaskFlow Backend ConfigMap
# Non-secret environment variables, matching backend/.env.example.
# DATABASE_URL and SECRET_KEY are sensitive and live in backend-secret.yaml instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-backend-config
  labels:
    app: taskflow-backend
data:
  API_V1_PREFIX: "/api/v1"
  BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
  HOST: "0.0.0.0"
  PORT: "8000"
  WORKERS: "4"
