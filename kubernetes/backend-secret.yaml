# TaskFlow Backend Secret
#
# PLACEHOLDER VALUES ONLY. Do not use these in any real deployment.
# DATABASE_URL mirrors the docker-compose taskflow/taskflow credentials for
# local/lab parity; SECRET_KEY is an obviously-fake placeholder. Every
# environment (each student's Minikube, staging, prod) must generate and
# apply its own values, e.g.:
#   kubectl create secret generic taskflow-backend-secret \
#     --from-literal=DATABASE_URL="postgresql://<user>:<pass>@taskflow-postgres:5432/taskflow" \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
